<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
  <script src="/Casa/blocco.js"></script><!-- sblocco a sequenza comune (hub) -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Home Vault</title>
<meta name="theme-color" content="#f3f4fa" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0c0e18" media="(prefers-color-scheme: dark)">
<meta name="robots" content="noindex, nofollow">
<link rel="manifest" href="manifest.json">

<style>
:root {
  --bg: #f3f4fa; --surface: #ffffff; --surface-2: #eef0f7; --text: #151829; --muted: #6b7090;
  --border: #e4e6f0; --primary: #5b4ff0; --primary-2: #8b5cf6; --primary-soft: #ecebff;
  --ok: #0e9467; --ok-soft: #e0f5ec; --warn: #b86e00; --warn-soft: #fdf1da;
  --danger: #d4334b; --danger-soft: #fde8eb;
  --shadow: 0 1px 2px rgba(21,24,41,.04), 0 6px 18px rgba(21,24,41,.05);
  --radius: 20px; color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0c0e18; --surface: #151827; --surface-2: #1e2235; --text: #eef0fa; --muted: #959bba;
    --border: #23273c; --primary: #8a83ff; --primary-2: #b38cff; --primary-soft: #23234a;
    --ok: #3fd39c; --ok-soft: #10342a; --warn: #f3bb52; --warn-soft: #382c12;
    --danger: #ff7389; --danger-soft: #3a1a22; --shadow: none; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0c0e18; --surface: #151827; --surface-2: #1e2235; --text: #eef0fa; --muted: #959bba;
  --border: #23273c; --primary: #8a83ff; --primary-2: #b38cff; --primary-soft: #23234a;
  --ok: #3fd39c; --ok-soft: #10342a; --warn: #f3bb52; --warn-soft: #382c12;
  --danger: #ff7389; --danger-soft: #3a1a22; --shadow: none; color-scheme: dark;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
[hidden] { display: none !important; }
html, body { margin: 0; }
body { overflow-x: hidden; overflow-x: clip; }
body {
  background: var(--bg); color: var(--text);
  font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  min-height: 100vh; padding-bottom: calc(100px + env(safe-area-inset-bottom));
  overflow-wrap: anywhere;
}
a { color: inherit; text-decoration: none; }
button, input, select, textarea { font: inherit; color: inherit; }
.wrap { max-width: 720px; margin: 0 auto; padding: calc(14px + env(safe-area-inset-top)) 16px 16px; }
.ico { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.ico.sm { width: 18px; height: 18px; }
.muted { color: var(--muted); }
.small { font-size: 13px; }

/* Intestazioni */
.top { display: flex; align-items: center; gap: 12px; margin: 6px 0 14px; }
.top h1 { font-size: 28px; line-height: 1.15; margin: 0; letter-spacing: -.02em; flex: 1; min-width: 0; }
.intro { color: var(--muted); font-size: 14px; margin: -6px 0 14px; }
.icon-btn {
  width: 44px; height: 44px; border-radius: 50%; border: 0; flex: none;
  background: var(--surface); color: var(--text); display: grid; place-items: center; cursor: pointer;
}
.icon-btn:active { transform: scale(.95); }
.sec-title { display: flex; align-items: baseline; gap: 8px; font-size: 17px; font-weight: 700; margin: 24px 2px 10px; }
.sec-title .n { color: var(--muted); font-weight: 600; font-size: 14px; }
.sec-title .more { margin-left: auto; font-size: 14px; color: var(--primary); font-weight: 600; flex: none; }

/* Hero home */
.hero {
  background: linear-gradient(140deg, var(--primary), var(--primary-2)); color: #fff;
  border-radius: 26px; padding: 18px 18px 16px;
}
.hero .riga1 { display: flex; align-items: center; gap: 10px; }
.hero .ciao { flex: 1; min-width: 0; opacity: .9; font-size: 15px; font-weight: 600; }
.hero .icon-btn { background: rgba(255,255,255,.18); color: #fff; width: 40px; height: 40px; }
.hero .lbl { margin-top: 14px; font-size: 13px; opacity: .85; }
.hero .tot { font-size: 34px; font-weight: 800; letter-spacing: -.02em; line-height: 1.1; }
.hero .pills { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin-top: 16px; }
.hero .pill { background: rgba(255,255,255,.15); border-radius: 14px; padding: 9px 10px; min-width: 0; }
.hero .pill b { display: block; font-size: 19px; line-height: 1.2; }
.hero .pill span { font-size: 12px; opacity: .9; line-height: 1.2; display: block; }

.btn-scan {
  display: flex; align-items: center; gap: 14px; margin-top: 12px; padding: 14px 16px;
  background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow);
}
.btn-scan .emo { background: var(--primary); color: #fff; }
.btn-scan .tx { flex: 1; min-width: 0; }
.btn-scan .t1 { font-weight: 700; }
.btn-scan .t2 { color: var(--muted); font-size: 13px; }

/* Card */
.card { background: var(--surface); border-radius: var(--radius); padding: 16px; box-shadow: var(--shadow); min-width: 0; }
.card + .card { margin-top: 12px; }
.card h2 { font-size: 16px; margin: 0 0 12px; }

/* Righe (elenco) */
.lista { background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow); overflow: hidden; }
.riga { display: flex; align-items: center; gap: 12px; padding: 13px 14px; min-width: 0; }
.riga + .riga { border-top: 1px solid var(--border); }
a.riga:active { background: var(--surface-2); }
.riga .tx { flex: 1; min-width: 0; }
.riga .t1 { font-weight: 650; line-height: 1.3; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.riga .t2 { display: block; color: var(--muted); font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-top: 1px; }
.riga .meta { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-top: 6px; font-size: 13px; color: var(--muted); }
.riga .dx { flex: none; font-weight: 700; font-size: 15px; white-space: nowrap; text-align: right; }
.riga .dx small { display: block; font-weight: 500; font-size: 12px; color: var(--muted); }
.riga .chev { color: var(--muted); opacity: .6; flex: none; }
.emo { width: 44px; height: 44px; border-radius: 14px; display: grid; place-items: center; font-size: 22px; background: var(--surface-2); flex: none; }

.chip { display: inline-flex; align-items: center; padding: 3px 9px; border-radius: 99px; font-size: 12px; font-weight: 650; background: var(--surface-2); color: var(--muted); white-space: nowrap; }
.chip.ok { background: var(--ok-soft); color: var(--ok); }
.chip.warn { background: var(--warn-soft); color: var(--warn); }
.chip.danger { background: var(--danger-soft); color: var(--danger); }
.chip.pri { background: var(--primary-soft); color: var(--primary); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.empty { text-align: center; color: var(--muted); padding: 22px 12px; font-size: 14px; }

/* Prodotti: ricerca e filtri */
.search { position: relative; }
.search .ico { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--muted); }
.search input { padding-left: 44px; background: var(--surface); border-color: transparent; }
.tabs { display: flex; gap: 8px; overflow-x: auto; padding: 12px 0 2px; scrollbar-width: none; margin: 0 -16px; padding-left: 16px; padding-right: 16px; }
.tabs::-webkit-scrollbar { display: none; }
.tab { border: 0; background: var(--surface); color: var(--muted); padding: 8px 14px; border-radius: 99px; font-weight: 650; font-size: 14px; white-space: nowrap; cursor: pointer; flex: none; }
.tab.on { background: var(--text); color: var(--bg); }
details.filtri { margin-top: 10px; }
details.filtri > summary { cursor: pointer; color: var(--primary); font-size: 14px; font-weight: 650; list-style: none; padding: 4px 2px; }
details.filtri > summary::-webkit-details-marker { display: none; }
.fgrid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; margin-top: 10px; }
.conteggio { color: var(--muted); font-size: 14px; margin: 14px 2px 10px; }

/* Scheda prodotto */
.back { display: inline-flex; align-items: center; gap: 4px; color: var(--muted); font-weight: 650; margin-bottom: 8px; cursor: pointer; background: none; border: 0; padding: 6px 0; }
.det-hero { text-align: center; padding: 6px 4px 4px; }
.det-hero .emo { width: 72px; height: 72px; font-size: 36px; border-radius: 22px; margin: 0 auto 12px; }
.det-hero h1 { margin: 0; font-size: 24px; line-height: 1.2; letter-spacing: -.01em; }
.det-hero .t2 { color: var(--muted); margin-top: 4px; }
.det-hero .chips { justify-content: center; margin-top: 10px; }
.tiles { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; margin-top: 16px; }
.tile { background: var(--surface); border-radius: 18px; padding: 12px 14px; box-shadow: var(--shadow); min-width: 0; }
.tile .l { font-size: 12px; color: var(--muted); font-weight: 600; }
.tile .v { font-size: 18px; font-weight: 750; margin-top: 2px; line-height: 1.25; }
.tile .s { font-size: 12px; margin-top: 4px; }
.kv .riga { display: block; padding: 11px 14px; }
.kv dt { font-size: 12.5px; color: var(--muted); font-weight: 600; }
.kv dd { margin: 2px 0 0; font-weight: 550; }
.kv dd a { color: var(--primary); font-weight: 650; }
.kv dd .chip { margin-left: 6px; vertical-align: 1px; }
.note { white-space: pre-wrap; }
.actions { display: flex; gap: 10px; margin-top: 18px; flex-wrap: wrap; }
.adddoc { border-top: 1px solid var(--border); padding: 14px; }
.adddoc .rr { display: flex; gap: 8px; margin-top: 8px; }
.adddoc select { flex: 1; min-width: 0; }

/* Bottoni e campi */
.btn {
  border: 0; border-radius: 16px; padding: 12px 18px; font-weight: 700; cursor: pointer;
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 50px; text-align: center;
}
.btn:disabled { opacity: .6; cursor: default; }
.btn.pri { background: var(--primary); color: #fff; }
.btn.sec { background: var(--surface-2); color: var(--text); }
.btn.dng { background: var(--danger-soft); color: var(--danger); }
.btn.full { width: 100%; }
.btn.mini { min-height: 40px; padding: 8px 14px; border-radius: 12px; flex: none; }
input, select, textarea {
  display: block; width: 100%; min-width: 0; max-width: 100%; border: 1.5px solid var(--border); background: var(--bg);
  border-radius: 14px; padding: 12px 14px; outline: none; min-height: 50px;
}
input[type="date"] { -webkit-appearance: none; appearance: none; }
textarea { min-height: 96px; resize: vertical; }
input:focus, select:focus, textarea:focus { border-color: var(--primary); }
.form { display: grid; gap: 14px; }
.fld { min-width: 0; }
.fld label { display: block; font-size: 14px; font-weight: 650; margin: 0 0 6px 2px; }
.fld .hint { font-size: 12.5px; color: var(--muted); margin: 5px 2px 0; }
.fld .hint.auto { color: var(--warn); }
.fgrid { display: grid; gap: 14px; grid-template-columns: minmax(0, 1fr); }
@media (min-width: 640px) { .fgrid { grid-template-columns: repeat(2, minmax(0, 1fr)); } .fgrid .wide { grid-column: 1 / -1; } }
.check { display: flex; align-items: center; gap: 12px; font-weight: 600; min-height: 50px; line-height: 1.3; }
.check input { width: 24px; height: 24px; min-height: 0; flex: none; accent-color: var(--primary); }
.req { color: var(--danger); }
.savebar { position: sticky; bottom: calc(84px + env(safe-area-inset-bottom)); z-index: 5; padding: 10px 0; }
details.altri > summary { cursor: pointer; list-style: none; display: flex; justify-content: space-between; align-items: center; gap: 10px; font-weight: 700; }
details.altri > summary::-webkit-details-marker { display: none; }
details.altri[open] > summary .fr { transform: rotate(180deg); }
.fr { transition: transform .2s; color: var(--muted); }

/* Lettura fattura */
.scan .actions { margin-top: 12px; }
.scan .actions .btn { flex: 1 1 140px; }
label.btn:has(input:disabled) { opacity: .5; pointer-events: none; }
.scanning { display: flex; align-items: center; gap: 10px; margin-top: 12px; font-weight: 600; color: var(--primary); }
.spin { width: 18px; height: 18px; border-radius: 50%; border: 3px solid var(--primary-soft); border-top-color: var(--primary); animation: gira .8s linear infinite; flex: none; }
@keyframes gira { to { transform: rotate(360deg); } }
.okdoc { display: flex; align-items: center; gap: 8px; margin-top: 12px; flex-wrap: wrap; font-weight: 700; }
.okdoc select { width: auto; min-height: 40px; padding: 6px 10px; }
details.letto summary { cursor: pointer; color: var(--primary); font-size: 14px; font-weight: 600; list-style: none; padding: 8px 0 4px; }
details.letto summary::-webkit-details-marker { display: none; }
.linechip { border: 0; cursor: pointer; text-align: left; white-space: normal; font-weight: 500; font-size: 13px; padding: 6px 10px; border-radius: 10px; }
input.dafattura, textarea.dafattura { border-color: var(--warn); background: var(--warn-soft); }

/* Statistiche */
.bars { display: grid; gap: 12px; }
.bar .top2 { display: flex; justify-content: space-between; gap: 10px; font-size: 14px; }
.bar .nm { color: var(--muted); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bar .am { font-weight: 700; flex: none; font-variant-numeric: tabular-nums; }
.bar .tr { height: 8px; border-radius: 99px; background: var(--surface-2); overflow: hidden; margin-top: 5px; }
.bar .fl { height: 100%; border-radius: 99px; background: linear-gradient(90deg, var(--primary), var(--primary-2)); }

/* Login */
.login { min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; }
.login .box { width: 100%; max-width: 380px; }
.logo { width: 76px; height: 76px; border-radius: 24px; margin: 0 auto 16px; display: grid; place-items: center; background: linear-gradient(140deg, var(--primary), var(--primary-2)); color: #fff; }
.logo .ico { width: 38px; height: 38px; }
.login h1 { text-align: center; margin: 0 0 4px; font-size: 28px; letter-spacing: -.02em; }
.login p.s { text-align: center; color: var(--muted); margin: 0 0 24px; }
.err { color: var(--danger); font-size: 14px; font-weight: 600; min-height: 20px; }

/* Navigazione */
nav.bottom {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 10;
  background: color-mix(in srgb, var(--surface) 94%, transparent);
  backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
  border-top: 1px solid var(--border);
  padding: 6px 8px calc(6px + env(safe-area-inset-bottom));
}
nav.bottom .in { max-width: 520px; margin: 0 auto; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); align-items: center; }
nav.bottom a { display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 11px; color: var(--muted); font-weight: 650; padding: 6px 0; min-width: 0; }
nav.bottom a.on { color: var(--primary); }
nav.bottom a.fab { width: 54px; height: 54px; border-radius: 50%; margin: -20px auto 0; background: var(--primary); color: #fff; justify-content: center; box-shadow: 0 8px 22px color-mix(in srgb, var(--primary) 45%, transparent); }
nav.bottom a.fab .ico { width: 28px; height: 28px; }

/* Visualizzatore documenti */
.viewer { position: fixed; inset: 0; z-index: 100; background: rgba(8,9,16,.95); display: flex; flex-direction: column; }
.vbar { display: flex; gap: 8px; align-items: center; padding: calc(10px + env(safe-area-inset-top)) 12px 10px; background: var(--surface); }
.vbar .vt { flex: 1; font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.vbar .btn { min-height: 40px; padding: 8px 14px; flex: none; }
.vbody { flex: 1; overflow: auto; display: flex; align-items: flex-start; justify-content: center; }
.vbody img { max-width: 100%; height: auto; display: block; margin: auto; }
.vbody iframe { width: 100%; height: 100%; border: 0; background: #fff; }

/* Varie */
.toast {
  position: fixed; left: 50%; bottom: calc(96px + env(safe-area-inset-bottom)); transform: translateX(-50%) translateY(20px);
  background: var(--text); color: var(--bg); padding: 12px 18px; border-radius: 14px; font-weight: 600; font-size: 14px;
  opacity: 0; pointer-events: none; transition: .25s; z-index: 150; width: max-content; max-width: calc(100% - 32px); text-align: center;
}
.toast.on { opacity: 1; transform: translateX(-50%) translateY(0); }
.toast.err { background: var(--danger); color: #fff; }
.skel { background: linear-gradient(90deg, var(--surface-2), var(--surface), var(--surface-2)); background-size: 200% 100%; animation: sk 1.2s infinite; border-radius: var(--radius); }
@keyframes sk { to { background-position: -200% 0; } }
.fade { animation: fd .22s ease; }
@keyframes fd { from { opacity: 0; transform: translateY(6px); } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<main id="app"></main>
<nav class="bottom" id="nav" hidden>
  <div class="in">
    <a href="#/home" data-nav="home"><span data-i="home"></span>Home</a>
    <a href="#/prodotti" data-nav="prodotti"><span data-i="box"></span>Prodotti</a>

    <a href="#/scadenze" data-nav="scadenze"><span data-i="shield"></span>Garanzie</a>
    <a href="#/altro" data-nav="altro"><span data-i="dots"></span>Altro</a>
  </div>
</nav>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
'use strict';
/* =========================================================
   CONFIGURAZIONE: incolla qui l'URL della web app di Apps Script
   (finisce con /exec). Non è un segreto: senza PIN non apre nulla.
   ========================================================= */
const API_URL = 'https://script.google.com/macros/s/AKfycbxdj3IFzUgoMA3PLSxcetu9Q_yqGX2kvQlXXsqEg4Z_WU0d80_XHhrQnap_DK02Ehxo/exec';
const VERSIONE = '4.0';

const STATI = ['In uso', 'In riparazione', 'Sostituito', 'Venduto', 'Dismesso'];
const AMBIENTI = ['Cucina', 'Soggiorno', 'Camera da letto', 'Cameretta', 'Bagno', 'Lavanderia', 'Studio', 'Taverna', 'Garage', 'Esterno'];
const PAGAMENTI = ['Contanti', 'Carta di credito', 'Bancomat', 'Bonifico', 'PayPal', 'Finanziamento'];

/* ---------- Archivio locale (solo preferenze, mai i dati) ---------- */
const mem = {
  get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} },
  del(k) { try { localStorage.removeItem(k); } catch (e) {} }
};

const S = {
  token: mem.get('hv_token'),
  utente: mem.get('hv_utente') || '',
  dati: null,
  caricando: false,
  vista: mem.get('hv_vista') || 'schede',
  filtri: { q: '', categoria: '', stato: '', anno: '', min: '', max: '', ordine: 'data-desc' },
  ultimaRotta: ''
};

/* ---------- Utilità ---------- */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const ESC = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' };
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ESC[c]);
const fmtEuroI = new Intl.NumberFormat('it-IT', { style: 'currency', currency: 'EUR' });
const fmtEuro0 = new Intl.NumberFormat('it-IT', { style: 'currency', currency: 'EUR', maximumFractionDigits: 0 });
const euro = n => fmtEuroI.format(Number(n) || 0);
const euroTondo = n => fmtEuro0.format(Number(n) || 0);
const num = v => { const n = Number(v); return v === '' || v === null || !isFinite(n) ? 0 : n; };
const haValore = v => v !== '' && v !== null && v !== undefined;

function parseData(s) {
  const m = String(s || '').match(/^(\d{4})-(\d{2})-(\d{2})/);
  return m ? new Date(+m[1], +m[2] - 1, +m[3]) : null;
}
function isoData(d) {
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}
function fmtData(s) {
  const d = parseData(s);
  return d ? d.toLocaleDateString('it-IT', { day: '2-digit', month: '2-digit', year: 'numeric' }) : '—';
}
function fmtDataOra(s) {
  if (!s) return '';
  const d = new Date(s);
  return isNaN(d) ? '' : d.toLocaleString('it-IT', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' });
}
function oggi() { const d = new Date(); d.setHours(0, 0, 0, 0); return d; }
function giorniA(s) { const d = parseData(s); return d ? Math.round((d - oggi()) / 864e5) : null; }
function aggiungiMesi(s, mesi) {
  const d = parseData(s);
  if (!d || !mesi) return '';
  const r = new Date(d.getFullYear(), d.getMonth() + Number(mesi), d.getDate());
  if (r.getDate() !== d.getDate()) r.setDate(0); // es. 31 gennaio + 1 mese → 28/29 febbraio
  return isoData(r);
}
function uid() {
  return (window.crypto && crypto.randomUUID) ? crypto.randomUUID()
    : Date.now().toString(36) + Math.random().toString(36).slice(2, 12);
}
const costo = p => num(p['Prezzo']) + num(p['Spese consegna']) + num(p['Spese installazione']);
const euroCampo = v => haValore(v) ? String(v).replace('.', ',') : '';

/* ---------- Comunicazione col server ---------- */
async function api(azione, extra = {}) {
  if (!/^https:\/\//.test(API_URL)) throw new Error("Manca l'indirizzo del server: va inserito in index.html (API_URL).");
  let r;
  try {
    r = await fetch(API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(Object.assign({ azione, token: S.token }, extra)),
      redirect: 'follow'
    });
  } catch (e) {
    const err = new Error('Connessione assente o server non raggiungibile.');
    err.rete = true;
    throw err;
  }
  let j;
  try { j = await r.json(); } catch (e) { throw new Error('Il server ha risposto in modo strano: controlla la pubblicazione dello script.'); }
  if (!j.ok) {
    if (j.codice === 'SESSIONE') { esci(false); toast(j.errore, true); }
    const err = new Error(j.errore || 'Errore sconosciuto.');
    err.codice = j.codice;
    throw err;
  }
  return j;
}

// Per le scritture: ritenta in caso di rete instabile, con lo stesso codice richiesta (niente doppioni).
async function apiSicura(azione, extra) {
  let ultimo;
  for (let i = 0; i < 3; i++) {
    try { return await api(azione, extra); }
    catch (e) {
      ultimo = e;
      if (!e.rete) throw e;
      await new Promise(r => setTimeout(r, 1200 * (i + 1)));
    }
  }
  throw ultimo;
}

async function carica() {
  S.caricando = true;

    const d = await api('dati');
    S.dati = d;
    if (d.utente) { S.utente = d.utente; mem.set('hv_utente', d.utente); }
  } catch (e) {
    S.caricando = false;
    if (S.token) $('#app').innerHTML = vErrore(e.message);
    return false;
  }
  S.caricando = false;
  return true;
}

/* ---------- File: preparazione e invio ---------- */
const MAX_MB = 10;
const TIPI_DOC = ['Fattura', 'Scontrino', 'Certificato garanzia', 'Manuale', 'Installazione', 'Manutenzione', 'Foto prodotto', 'Foto targhetta', 'Altro'];
const CAMPI_EURO = ['Prezzo', 'IVA', 'Spese consegna', 'Spese installazione'];

function aBase64(blob) {
  return new Promise((ok, ko) => {
    const r = new FileReader();
    r.onload = () => ok(String(r.result).split(',')[1] || '');
    r.onerror = () => ko(new Error('Non riesco a leggere il file.'));
    r.readAsDataURL(blob);
  });
}

// Le foto del telefono pesano molto: le rimpicciolisco (resta leggibile) prima di inviarle.
async function comprimiImmagine(file) {
  const url = URL.createObjectURL(file);
  try {
    const img = await new Promise((ok, ko) => {
      const i = new Image();
      i.onload = () => ok(i);
      i.onerror = () => ko(new Error('Formato immagine non supportato: usa una foto JPG o PNG.'));
      i.src = url;
    });
    let lato = 2200, q = 0.85, blob = null;
    for (let t = 0; t < 5; t++) {
      const s = Math.min(1, lato / Math.max(img.naturalWidth, img.naturalHeight));
      const c = document.createElement('canvas');
      c.width = Math.round(img.naturalWidth * s);
      c.height = Math.round(img.naturalHeight * s);
      const ctx = c.getContext('2d');
      ctx.fillStyle = '#fff';
      ctx.fillRect(0, 0, c.width, c.height);
      ctx.drawImage(img, 0, 0, c.width, c.height);
      blob = await new Promise(r => c.toBlob(r, 'image/jpeg', q));
      if (blob && blob.size < 1.8 * 1024 * 1024) break;
      lato *= 0.8; q -= 0.07;
    }
    if (!blob) throw new Error('Non riesco a preparare la foto.');
    return blob;
  } finally {
    URL.revokeObjectURL(url);
  }
}

async function preparaFile(file) {
  if (!file) throw new Error('Nessun file scelto.');
  if (file.type === 'application/pdf' || /\.pdf$/i.test(file.name)) {
    if (file.size > MAX_MB * 1024 * 1024) throw new Error(`Il PDF supera ${MAX_MB} MB.`);
    return { mime: 'application/pdf', base64: await aBase64(file) };
  }
  if ((file.type || '').startsWith('image/') || /\.(jpe?g|png|heic|heif|webp)$/i.test(file.name)) {
    return { mime: 'image/jpeg', base64: await aBase64(await comprimiImmagine(file)) };
  }
  throw new Error('Formato non supportato: usa una foto, un JPG, un PNG o un PDF.');
}

function b64aBlob(b64, mime) {
  const bin = atob(b64);
  const u = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i);
  return new Blob([u], { type: mime });
}

/* ---------- Visualizzatore documenti ---------- */
async function apriDocumento(id, btn) {
  if (btn) btn.disabled = true;
  toast('Apro il documento…');
  try {
    const r = await api('apriDocumento', { id });
    const url = URL.createObjectURL(b64aBlob(r.base64, r.mime));
    const immagine = r.mime.startsWith('image/');
    const pdfInterno = r.mime === 'application/pdf' && navigator.pdfViewerEnabled;
    const scarica = `<a class="btn sec" href="${url}" download="${esc(r.nome)}">Scarica</a>`;
    const ov = document.createElement('div');
    ov.className = 'viewer';
    ov.innerHTML = `<div class="vbar"><span class="vt">${esc(r.nome)}</span>${scarica}
      <button class="btn pri" type="button" id="vchiudi">Chiudi</button></div>
      <div class="vbody">${immagine ? `<img src="${url}" alt="${esc(r.nome)}">`
        : pdfInterno ? `<iframe src="${url}" title="${esc(r.nome)}"></iframe>`
        : `<div class="card empty" style="margin:16px">L'anteprima dei PDF non è disponibile qui.<br><br>
           <a class="btn pri" href="${url}" download="${esc(r.nome)}">Scarica e apri il PDF</a></div>`}</div>`;
    document.body.appendChild(ov);
    document.body.style.overflow = 'hidden';
    const tasto = e => { if (e.key === 'Escape') chiudi(); };
    function chiudi() {
      ov.remove();
      document.body.style.overflow = '';
      document.removeEventListener('keydown', tasto);
      setTimeout(() => URL.revokeObjectURL(url), 60000);
    }
    document.addEventListener('keydown', tasto);
    ov.querySelector('#vchiudi').onclick = chiudi;
  } catch (e) {
    toast(e.message, true);
  } finally {
    if (btn) btn.disabled = false;
  }
}

/* ---------- Dati derivati ---------- */
const attivi = () => (S.dati?.prodotti || []).filter(p => !p['Nel cestino']);
const nelCestino = () => (S.dati?.prodotti || []).filter(p => p['Nel cestino']);
const trova = id => (S.dati?.prodotti || []).find(p => String(p['ID']) === String(id));
const docsDi = id => (S.dati?.documenti || []).filter(d => String(d['ID prodotto']) === String(id) && d['Attivo'] !== false);
const haFattura = id => docsDi(id).some(d => ['Fattura', 'Scontrino'].includes(d['Tipo documento']));
const ancoraInCasa = p => !['Venduto', 'Dismesso', 'Sostituito'].includes(p['Stato']);

function scadenze() {
  const out = [];
  attivi().filter(ancoraInCasa).forEach(p => {
    [['Scadenza garanzia', 'Garanzia'], ['Scadenza garanzia aggiuntiva', 'Garanzia aggiuntiva']].forEach(([campo, tipo]) => {
      if (!p[campo]) return;
      out.push({ p, tipo, data: p[campo], giorni: giorniA(p[campo]), verificata: tipo === 'Garanzia' ? !!p['Garanzia verificata'] : true });
    });
  });
  return out.sort((a, b) => a.giorni - b.giorni);
}

function mancanze(p) {
  const m = [];
  if (!haFattura(p['ID'])) m.push('fattura');
  if (!p['Data acquisto']) m.push('data acquisto');
  if (!haValore(p['Prezzo'])) m.push('prezzo');
  if (!p['Scadenza garanzia'] && !haValore(p['Garanzia (mesi)'])) m.push('garanzia');
  return m;
}

function chipStato(s) {
  const cls = { 'In uso': 'ok', 'In riparazione': 'warn' }[s] ?? '';
  return `<span class="chip ${cls}">${esc(s || 'In uso')}</span>`;
}
function chipGiorni(g) {
  if (g === null) return '';
  if (g < 0) return `<span class="chip danger">Scaduta</span>`;
  if (g === 0) return `<span class="chip danger">Scade oggi</span>`;
  if (g === 1) return `<span class="chip warn">Scade domani</span>`;
  if (g <= 30) return `<span class="chip warn">Tra ${g} giorni</span>`;
  if (g <= 90) return `<span class="chip pri">Tra ${g} giorni</span>`;
  return `<span class="chip ok">Attiva</span>`;
}
function sottotitolo(p) {
  return [p['Marca'], p['Modello']].filter(Boolean).map(esc).join(' · ') || esc(p['Categoria'] || 'Senza categoria');
}

/* ---------- Router ---------- */
function rotta() {
  const h = location.hash.replace(/^#\/?/, '');
  const i = h.indexOf('/');
  return i === -1 ? { p: h || 'home', id: '' } : { p: h.slice(0, i), id: decodeURIComponent(h.slice(i + 1)) };
}
window.addEventListener('hashchange', () => render());

function render(mantieniScroll = false) {
  const app = $('#app');
  if (!S.token) {
    $('#nav').hidden = true;
    app.innerHTML = vLogin();
    bindLogin();
    return;
  }
  $('#nav').hidden = false;
  const r = rotta();
  $$('#nav [data-nav]').forEach(a => a.classList.toggle('on', a.dataset.nav === r.p || (r.p === 'prodotto' && a.dataset.nav === 'prodotti')));

  if (!S.dati) {
    app.innerHTML = vCaricamento();
    if (!S.caricando) carica().then(ok => { if (ok) render(); });
    return;
  }

  const viste = { home: vHome, prodotti: vProdotti, prodotto: vScheda, nuovo: vModulo, modifica: vModulo, scadenze: vScadenze, altro: vAltro };
  const vista = viste[r.p] || vHome;
  app.innerHTML = `<div class="wrap fade">${vista(r.p === 'nuovo' ? '' : r.id)}</div>`;
  bind(r);
  const chiave = r.p + '/' + r.id;
  if (!mantieniScroll && chiave !== S.ultimaRotta) window.scrollTo(0, 0);
  S.ultimaRotta = chiave;
}

function bindLogin() {
  $('#flogin').addEventListener('submit', async e => {
    e.preventDefault();
    const nome = $('#lnome').value.trim(), pin = $('#lpin').value.trim(), btn = $('#lbtn');
    $('#lerr').textContent = '';
    if (!nome) { $('#lerr').textContent = 'Scrivi il tuo nome.'; return; }
    if (!/^(?!.*['"`\\])[\x21-\x7E]{6,40}$/.test(pin)) { $('#lerr').textContent = 'Controlla la chiave: niente spazi, accenti o virgolette.'; return; }
    btn.disabled = true; btn.textContent = 'Controllo…';
    try {
      const r = await api('login', { pin, utente: nome });
      S.token = r.token; S.utente = r.utente;
      mem.set('hv_token', r.token); mem.set('hv_utente', r.utente);
      if (!location.hash) location.hash = '#/home';
      render();
    } catch (err) {
      $('#lerr').textContent = err.message;
      btn.disabled = false; btn.textContent = 'Entra';
      $('#lpin').value = ''; $('#lpin').focus();
    }
  });
}

  const attiviFiltri = [f.stato, f.anno, f.min, f.max].filter(Boolean).length + (f.ordine !== 'data-desc' ? 1 : 0);

  return `<div class="top"><h1>Prodotti</h1></div>

        ${opt('prezzo-desc', 'Prima i più cari', f.ordine)}${opt('prezzo-asc', 'Prima i meno cari', f.ordine)}${opt('nome', 'Nome dalla A alla Z', f.ordine)}
      </select>

}

function filtrati() {
  const f = S.filtri;
  const parole = f.q.toLowerCase().split(/\s+/).filter(Boolean);
  const campi = ['Nome', 'Marca', 'Modello', 'Numero di serie', 'Codice prodotto', 'Numero fattura', 'Venditore', 'Categoria', 'Sottocategoria', 'Ambiente', 'Note', 'ID'];
  const min = f.min ? Number(String(f.min).replace(',', '.')) : null;
  const max = f.max ? Number(String(f.max).replace(',', '.')) : null;
  let l = attivi().filter(p => {
    if (f.categoria && p['Categoria'] !== f.categoria) return false;
    if (f.stato && (p['Stato'] || 'In uso') !== f.stato) return false;
    if (f.anno && String(parseData(p['Data acquisto'])?.getFullYear()) !== f.anno) return false;
    if (min !== null && isFinite(min) && costo(p) < min) return false;
    if (max !== null && isFinite(max) && costo(p) > max) return false;
    if (parole.length) {
      const testo = campi.map(c => String(p[c] ?? '')).join(' ').toLowerCase();
      if (!parole.every(w => testo.includes(w))) return false;
    }
    return true;
  });
  const dataOrd = p => p['Data acquisto'] || String(p['Creato il'] || '').slice(0, 10);
  const ord = {
    'data-desc': (a, b) => dataOrd(b).localeCompare(dataOrd(a)),
    'data-asc': (a, b) => dataOrd(a).localeCompare(dataOrd(b)),
    'prezzo-desc': (a, b) => costo(b) - costo(a),
    'prezzo-asc': (a, b) => costo(a) - costo(b),
    'nome': (a, b) => String(a['Nome']).localeCompare(String(b['Nome']), 'it')
  }[f.ordine];
  return l.sort(ord);
}

  const l = filtrati();
  $('#conteggio').textContent = l.length === 1 ? '1 prodotto' : l.length + ' prodotti';

    box.className = '';

  box.className = 'lista';

  <div class="card"><h2>Per categoria</h2>${barre(cats, Math.max(0, ...cats.map(c => c[1])))}</div>

  ${titolo('Cestino', cest.length)}
  <div class="lista">${cest.length ? cest.map(p => `<div class="riga"><span class="emo">${emoji(p)}</span>
    <span class="tx"><span class="t1">${esc(p['Nome'])}</span><span class="t2">Tolto da ${esc(p['Eliminato da'] || '?')} · ${fmtDataOra(p['Eliminato il'])}</span></span>
    <button class="btn sec mini" data-ripristina="${esc(p['ID'])}" aria-label="Ripristina">${ico('undo', 'sm')}</button></div>`).join('')
    : '<div class="empty">Il cestino è vuoto.</div>'}</div>

  ${registro.length ? titolo('Ultime modifiche') + `<div class="lista">${registro.map(r => `<div class="riga">
    <span class="tx"><span class="t1" style="font-weight:550">${esc(r['Operazione'])}: ${esc(r['Dettaglio'])}</span>
    <span class="t2">${esc(r['Utente'])} · ${fmtDataOra(r['Data'])}</span></span></div>`).join('')}</div>` : ''}

  ${titolo('Impostazioni')}
  <div class="card"><div class="fld"><label for="tema">Aspetto</label>
    <select id="tema"><option value="auto" ${tema === 'auto' ? 'selected' : ''}>Come il telefono</option>
    <option value="light" ${tema === 'light' ? 'selected' : ''}>Chiaro</option><option value="dark" ${tema === 'dark' ? 'selected' : ''}>Scuro</option></select></div>
    <button class="btn sec full" id="brefresh" style="margin-top:14px">${ico('refresh', 'sm')} Aggiorna i dati</button>
    <p class="small muted" style="margin:12px 0 0;text-align:center">I dati stanno nel foglio Google privato di Federico · Home Vault ${VERSIONE}</p></div>`;
}

/* ---------- Eventi ---------- */
function bind(r) {
  const br = $('#brefresh');
  if (br) br.onclick = async () => { br.disabled = true; if (await ricarica()) toast('Dati aggiornati'); };

  $$('[data-cestina]').forEach(b => b.onclick = async () => {
    const p = trova(b.dataset.cestina);
    if (!confirm(`Spostare "${p ? p['Nome'] : ''}" nel cestino?\n\nPotrai ripristinarlo dalla sezione Altro.`)) return;
    b.disabled = true;
    try {
      await apiSicura('cestino', { id: b.dataset.cestina });
      await carica();
      toast('Spostato nel cestino');
      location.hash = '#/prodotti';
    } catch (e) { toast(e.message, true); b.disabled = false; }
  });

  $$('[data-ripristina]').forEach(b => b.onclick = async () => {
    b.disabled = true;
    try {
      await apiSicura('ripristina', { id: b.dataset.ripristina });
      await carica();
      toast('Prodotto ripristinato');
      render(true);
    } catch (e) { toast(e.message, true); b.disabled = false; }
  });

  if (r.p === 'prodotti') bindProdotti();
  if (r.p === 'prodotto') bindDocumenti();
  if (r.p === 'nuovo' || r.p === 'modifica') bindModulo(r.p === 'modifica' ? r.id : '');
  if (r.p === 'altro') {
    $('#tema').onchange = e => { mem.set('hv_tema', e.target.value); applicaTema(); };
    $('#besci').onclick = () => { if (confirm('Vuoi uscire? Per rientrare servirà di nuovo il PIN.')) esci(true); };
  }
}

function bindProdotti() {
  const f = S.filtri;
  let t;
  $('#q').oninput = e => { clearTimeout(t); t = setTimeout(() => { f.q = e.target.value; aggiornaLista(); }, 150); };
  $$('#tabs [data-cat]').forEach(b => b.onclick = () => {
    f.categoria = b.dataset.cat;
    $$('#tabs [data-cat]').forEach(x => x.classList.toggle('on', x === b));
    aggiornaLista();
  });
  $('#fstato').onchange = e => { f.stato = e.target.value; aggiornaLista(); };
  $('#fanno').onchange = e => { f.anno = e.target.value; aggiornaLista(); };
  $('#fordine').onchange = e => { f.ordine = e.target.value; aggiornaLista(); };
  $('#fmin').oninput = e => { f.min = e.target.value; aggiornaLista(); };
  $('#fmax').oninput = e => { f.max = e.target.value; aggiornaLista(); };
  aggiornaLista();
}

function bindDocumenti() {
  $$('[data-doc]').forEach(b => b.onclick = () => apriDocumento(b.dataset.doc, b));
  $$('[data-carica]').forEach(inp => inp.onchange = async () => {
    const file = inp.files[0];
    inp.value = '';
    if (!file) return;
    const stato = $('#dstato');
    const tipo = $('#dtipo').value;
    $$('[data-carica]').forEach(i => { i.disabled = true; });
    stato.innerHTML = '<span class="scanning"><span class="spin"></span> Carico il documento…</span>';
    try {
      const f = await preparaFile(file);
      await apiSicura('caricaDocumento', { idProdotto: inp.dataset.carica, tipo, file: f, richiestaId: uid() });
      await carica();
      toast(tipo + ' aggiunto ✓');
      render(true);
    } catch (e) {
      stato.innerHTML = `<span style="color:var(--danger)">${esc(e.message)}</span>`;
      $$('[data-carica]').forEach(i => { i.disabled = false; });
    }
  });
}

function bindModulo(id) {
  const form = $('#fprod');
  const el = nome => form.querySelector(`[data-campo="${nome}"]`);
  const cat = el('Categoria');
  const acquisto = el('Data acquisto'), mesi = el('Garanzia (mesi)'), scad = el('Scadenza garanzia');
  const hintScad = $('#' + scad.id + '_h');

  if (!id) el('Acquistato da').value = S.utente;

  const segna = (nome, testo) => {
    const i = el(nome);
    if (!i) return;
    const h = $('#' + i.id + '_h');
    if (h) { h.hidden = false; h.className = 'hint auto'; h.textContent = testo; }
    i.classList.add('dafattura');
  };
  $$('[data-campo]', form).forEach(i => i.addEventListener('input', () => i.classList.remove('dafattura')));

  const aggiornaSotto = () => {
    const l = (S.dati.categorie || []).filter(c => c['Categoria'] === cat.value && c['Sottocategoria']).map(c => c['Sottocategoria']);
    $('#dlsub').innerHTML = [...new Set(l)].map(x => `<option value="${esc(x)}">`).join('');
  };
  cat.addEventListener('input', aggiornaSotto);
  aggiornaSotto();

  // Scadenza suggerita dalla durata: solo se l'utente non l'ha scritta a mano.
  scad.dataset.auto = scad.value ? '0' : '1';
  const suggerisci = () => {
    if (scad.dataset.auto !== '1') return;
    const s = aggiungiMesi(acquisto.value, mesi.value);
    scad.value = s;
    hintScad.hidden = !s;
    hintScad.className = 'hint auto';
    hintScad.textContent = s ? 'Calcolata da data di acquisto + durata. Controllala sul documento.' : '';
  };
  acquisto.addEventListener('change', suggerisci);
  mesi.addEventListener('input', suggerisci);
  scad.addEventListener('input', () => { scad.dataset.auto = scad.value ? '0' : '1'; hintScad.hidden = true; });

  // ----- Fattura: foto o PDF -----
  const stato = $('#scanstato');
  const ingressi = () => $$('#fcam, #ffile');
  const leggi = async file => {
    if (!file) return;
    ingressi().forEach(i => { i.disabled = true; });
    stato.innerHTML = '<div class="scanning"><span class="spin"></span> Leggo la fattura… può volerci fino a mezzo minuto</div>';
    try {
      const f = await preparaFile(file);
      const r = await apiSicura('leggiFattura', { file: f, richiestaId: uid() });
      form.dataset.fileId = r.fileId;

      let n = 0;
      Object.entries(r.estratti || {}).forEach(([k, val]) => {
        const i = el(k);
        if (!i || i.type === 'checkbox' || i.value.trim()) return;
        i.value = CAMPI_EURO.includes(k) ? euroCampo(val) : String(val);
        segna(k, '📄 Letto dalla fattura: controlla che sia giusto.');
        if (i.closest('#altri')) $('#altri').open = true;
        n++;
      });
      if ((r.estratti || {})['Categoria']) aggiornaSotto();
      suggerisci();

      stato.innerHTML = `
        <div class="okdoc">✅ Fattura allegata
          <select id="stipo" aria-label="Tipo di documento"><option>Fattura</option><option>Scontrino</option></select>
          <button type="button" class="btn sec" id="stogli" style="min-height:40px;padding:6px 12px">Togli</button></div>
        <p class="small" style="margin:8px 0 0">${n
          ? `Ho compilato ${n} camp${n === 1 ? 'o' : 'i'} (in giallo): controllali prima di salvare.`
          : 'Non ho trovato dati sicuri da compilare: inseriscili tu, la fattura resta comunque allegata.'}</p>
        ${r.avviso ? `<p class="small" style="color:var(--warn);margin:6px 0 0">${esc(r.avviso)}</p>` : ''}
        ${(r.righe || []).length ? `<details class="letto"><summary>Testo letto · tocca una riga per usarla come nome ▾</summary>
          <div class="chips" style="margin-top:8px">${r.righe.map(x => `<button type="button" class="chip linechip" data-riga="${esc(x)}">${esc(x)}</button>`).join('')}</div></details>` : ''}`;

      $$('[data-riga]', stato).forEach(b => b.onclick = () => {
        const i = el('Nome');
        i.value = b.dataset.riga;
        segna('Nome', 'Preso dal testo della fattura.');
        i.scrollIntoView({ block: 'center', behavior: 'smooth' });
      });
      $('#stogli').onclick = () => {
        delete form.dataset.fileId;
        stato.innerHTML = '<p class="small muted" style="margin:10px 0 0">Fattura tolta. I campi già compilati restano: puoi correggerli.</p>';
        ingressi().forEach(i => { i.disabled = false; });
      };
    } catch (e) {
      stato.innerHTML = `<p class="small" style="color:var(--danger);margin:10px 0 0">${esc(e.message)}</p>`;
      ingressi().forEach(i => { i.disabled = false; });
    }
  };
  ingressi().forEach(i => i.onchange = () => { const f = i.files[0]; i.value = ''; leggi(f); });

  // ----- Salvataggio -----
  form.addEventListener('submit', async e => {
    e.preventDefault();
    const err = $('#ferr'), btn = $('#bsalva');
    err.textContent = '';
    const dati = {};
    $$('[data-campo]', form).forEach(i => { dati[i.dataset.campo] = i.type === 'checkbox' ? i.checked : i.value.trim(); });

    const sbaglio = (msg, campoErr) => {
      err.textContent = msg;
      const i = el(campoErr);
      if (i) { if (i.closest('#altri')) $('#altri').open = true; i.focus(); }
    };
    if (!dati['Nome']) return sbaglio('Scrivi cos\'è il prodotto.', 'Nome');
    for (const k of CAMPI_EURO) {
      const s = String(dati[k] || '').replace(/\s|€/g, '');
      const n = Number(s.includes(',') ? s.replace(/\./g, '').replace(',', '.') : s);
      if (s && (!isFinite(n) || n < 0)) return sbaglio(`Controlla l'importo in "${k}".`, k);
    }
    for (const k of ['Link prodotto', 'Link produttore']) {
      if (dati[k] && !/^https?:\/\/\S+$/i.test(dati[k])) return sbaglio(`Il link in "${k}" deve iniziare con https://`, k);
    }
    if (id) dati.ID = id;
    const documento = form.dataset.fileId ? { fileId: form.dataset.fileId, tipo: ($('#stipo') || {}).value || 'Fattura' } : null;

    btn.disabled = true; btn.textContent = 'Salvataggio…';
    try {
      const r = await apiSicura('salvaProdotto', { prodotto: dati, documento, richiestaId: form.dataset.rid });
      await carica();
      if (r.avviso) toast(r.avviso, true);
      else toast(id ? 'Modifiche salvate ✓' : 'Acquisto salvato ✓');
      location.replace('#/prodotto/' + encodeURIComponent(r.id));
    } catch (e2) {
      err.textContent = e2.message;
      btn.disabled = false; btn.textContent = id ? 'Salva modifiche' : 'Salva acquisto';
    }
  });
}

/* ---------- Avvio ---------- */
$$('[data-i]').forEach(s => { s.outerHTML = ico(s.dataset.i); });
applicaTema();
if (!location.hash) location.hash = '#/home';
render();
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}
</script>
</body>
</html>
